<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Education | 账号与安全</title>
    <link rel="stylesheet" href="./src/styles.css?v=style-core-10" />
  </head>
  <body class="sign-in-body account-body">
    <main class="account-shell">
      <section class="account-intro">
        <a class="sign-in-brand" id="account-return" href="./index.html"><span>AI</span><strong>AI Education</strong></a>
        <div>
          <p>账号与安全</p>
          <h1>把学习留在学习里，账号设置放在这里。</h1>
          <span id="account-role-label"></span>
        </div>
      </section>
      <section class="account-content" aria-live="polite">
        <div class="account-heading">
          <p class="label">我的账号</p>
          <h2 id="account-name">正在读取账号...</h2>
          <span id="account-login-name"></span>
        </div>
        <form id="account-profile-form" class="account-form">
          <label for="account-display-name">显示名称</label>
          <input id="account-display-name" name="displayName" maxlength="48" autocomplete="name" required />
          <p class="account-status" id="account-profile-status"></p>
          <button class="primary-action" type="submit">保存名称</button>
        </form>
        <section class="account-password-section" id="account-relationship-section" hidden>
          <div>
            <p class="label">可选协作</p>
            <h3>邀请一位支持你的人。</h3>
          </div>
          <form id="account-relationship-form" class="account-form">
            <label for="account-relationship-role">对方身份</label>
            <select id="account-relationship-role" name="targetRole" required>
              <option value="parent">家长</option>
              <option value="teacher">老师</option>
            </select>
            <p class="account-note">这不会改变你的学习计划，只是让对方可以在自己的页面里支持你。</p>
            <p class="account-status" id="account-relationship-status"></p>
            <div class="relationship-code" id="account-relationship-result" hidden>
              <span>一次性关联码</span>
              <strong id="account-relationship-code"></strong>
              <button class="text-action" id="account-relationship-copy" type="button">复制</button>
            </div>
            <button class="primary-action" id="account-relationship-submit" type="submit">生成关联码</button>
          </form>
        </section>
        <section class="account-password-section">
          <div>
            <p class="label">密码</p>
            <h3>更新密码</h3>
          </div>
          <form id="account-password-form" class="account-form">
            <label for="account-current-password">当前密码</label>
            <input id="account-current-password" name="currentPassword" type="password" autocomplete="current-password" required />
            <label for="account-new-password">新密码</label>
            <input id="account-new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" required />
            <label for="account-confirm-password">确认新密码</label>
            <input id="account-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required />
            <p class="account-status" id="account-password-status"></p>
            <button class="primary-action" type="submit">更新密码</button>
            <p class="account-note">新密码至少 12 个字符，并包含字母和数字。更新后，其他已登录设备会退出。</p>
          </form>
        </section>
        <button class="account-sign-out" id="account-sign-out" type="button">退出登录</button>
      </section>
    </main>
    <script type="module" src="./src/account-app.js?v=student-optional-link-1"></script>
  </body>
</html>
